

# MicroDCS Kubernetes Deployment
#
# Two Deployments:
#   1. Processor – scales horizontally with shared MQTT subscriptions and runs the SFC engine on every replica
#   2. Publisher – single replica maintaining retained MQTT topics
#
# Both share the same container image, differentiated by APP_IS_PROCESSOR_INSTANCE
# and APP_IS_PUBLISHER_INSTANCE environment variables.
#
# The SFC engine is not single-instance gated. It relies on Redis Streams consumer
# groups and CAS Lua scripts for distributed execution and recovery. Equipment-side
# command handling must be idempotent; the engine sends a stable mdcsactionkey
# with every push_command for deduplication.
#
# Hardening: pods run as the distroless non-root user with a read-only root
# filesystem and no Kubernetes API token, and a NetworkPolicy denies all ingress
# (the MessagePack-RPC port is meant for a sidecar in the same pod). Pin the image
# to a digest instead of :latest for production. There are no probes: the process
# exits when Redis or MQTT is lost and Kubernetes restarts it.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microdcs-processor
  labels:
    app: microdcs
    role: processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microdcs
      role: processor
  template:
    metadata:
      labels:
        app: microdcs
        role: processor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: microdcs
          image: aschamberger/microdcs:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: APP_IS_PROCESSOR_INSTANCE
              value: "true"
            - name: APP_IS_PUBLISHER_INSTANCE
              value: "false"
            - name: APP_REDIS_HOSTNAME
              value: redis
            - name: APP_MQTT_HOSTNAME
              value: mqtt-broker
            - name: APP_PROCESSING_TOPIC_PREFIXES
              value: "greetings:app/greetings,machinery-jobs:app/jobs"
            - name: APP_PROCESSING_RESPONSE_TOPICS
              value: "greetings:app/greetings/responses,machinery-jobs:app/jobs/responses"
            - name: APP_PROCESSING_SHARED_SUBSCRIPTION_NAME
              value: "appsub"
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microdcs-publisher
  labels:
    app: microdcs
    role: publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microdcs
      role: publisher
  template:
    metadata:
      labels:
        app: microdcs
        role: publisher
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: microdcs
          image: aschamberger/microdcs:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: APP_IS_PROCESSOR_INSTANCE
              value: "false"
            - name: APP_IS_PUBLISHER_INSTANCE
              value: "true"
            - name: APP_REDIS_HOSTNAME
              value: redis
            - name: APP_MQTT_HOSTNAME
              value: mqtt-broker
            - name: APP_PROCESSING_TOPIC_PREFIXES
              value: "greetings:app/greetings,machinery-jobs:app/jobs"
            - name: APP_PUBLISHER_RETAINED_TTL_SECONDS
              value: "172800"
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: microdcs-deny-ingress
spec:
  podSelector:
    matchLabels:
      app: microdcs
  policyTypes:
    - Ingress
