# Pods for the NetworkPolicy checks in scripts/k8s-test.
#   * netpol-probe carries app.kubernetes.io/name=microdcs, so the microdcs egress policies apply to it (it is not part of either
#     Deployment, whose selectors also name a component).
#   * decoy listens on a port that no policy allows; reaching it from the probe must fail.
#   * api-client carries the management-client label; reaching the management port from it must work.

apiVersion: v1
kind: Pod
metadata:
  name: netpol-probe
  labels:
    app.kubernetes.io/name: microdcs
    app.kubernetes.io/component: netpol-probe
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: busybox
      image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: 10m, memory: 8Mi, ephemeral-storage: 1Mi}
        limits: {cpu: 100m, memory: 32Mi, ephemeral-storage: 8Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: api-client
  labels:
    app.kubernetes.io/name: api-client
    microdcs.io/management-client: "true"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: busybox
      image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: 10m, memory: 8Mi, ephemeral-storage: 1Mi}
        limits: {cpu: 100m, memory: 32Mi, ephemeral-storage: 8Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: decoy
  labels:
    app.kubernetes.io/name: decoy
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: busybox
      image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["nc", "-lk", "-p", "8080", "-e", "echo", "decoy"]
      ports:
        - containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: 10m, memory: 8Mi, ephemeral-storage: 1Mi}
        limits: {cpu: 100m, memory: 32Mi, ephemeral-storage: 8Mi}
