# NATS server for the integration tests (D-47). Plain text, test only.
# The default account runs the transport tests; tenant-a and tenant-b prove account isolation (R-20).
port: 4222
http: 8222
jetstream: { store_dir: "/tmp/nats-js" }

accounts {
  DEFAULT { jetstream: enabled, users: [ { user: default, password: default } ] }
  TENANT_A { jetstream: enabled, users: [ { user: a, password: a } ] }
  TENANT_B { jetstream: enabled, users: [ { user: b, password: b } ] }
}
no_auth_user: default
