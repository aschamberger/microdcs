# Builds the docs site with the pinned zensical (docs/requirements.txt) and deploys it to
# GitHub Pages through Actions (Pages source: GitHub Actions; no gh-pages branch).
# Pull requests that touch the docs build only (no deploy), so a broken build shows before the merge.
# Actions are pinned by full commit SHA with the release in a comment (D-20); Dependabot bumps both.
name: docs
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # wheel-only install (pip --only-binary); bump when all docs/requirements.txt pins ship wheels
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - id: cache-id
        run: echo "week=$(date --utc '+%V')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: zensical-${{ steps.cache-id.outputs.week }}
          path: .cache
          restore-keys: |
            zensical-
      - run: 'pip install --require-hashes --only-binary :all: -r docs/requirements.txt'
      - run: zensical build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # Pages deployment verifies the workflow's OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
