# .NET CI: build, unit and integration tests with coverage against the compose.test.yaml services, SonarQube Cloud analysis
# (D-20), format, NuGet audit, Native AOT container image with the CloudEvents smoke check (D-14), the SFC replica tests
# (D-53) with the acceptance tests against the image (S23), the Kubernetes manifest in kind (S22) and the benchmark baseline
# (D-58). Gitleaks and Trivy run in security.yml.
# Pushes to main and v* tags publish the multi-arch image to GHCR, signed and with SBOM attestations
# (cosign keyless, D-55); pull requests never publish.
# What runs on a pull request depends on the changed paths (scripts/ci-changes, D-56): documentation-only changes build and
# analyse only; linux-arm64 and kind run when the image inputs or the manifest change, and always on main and daily.
# Required checks must report on every PR, so a job that does not apply is skipped as a whole (reported as success), and a
# matrix job skips its steps instead (a skipped matrix job reports under its unexpanded name).
# Job names are required checks on `main` (changes, dotnet, container (linux-x64), container (linux-arm64),
# integration, kubernetes); renaming a job or a matrix entry means updating the branch protection.
# Actions are pinned by full commit SHA with the release in a comment (D-20); Dependabot bumps both.
name: ci
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "41 4 * * *" # daily: the jobs a PR may skip (linux-arm64, kind) against current runners and actions
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CI: "true" # locked-mode restore (Directory.Build.props)
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # Decides which jobs a pull request needs (scripts/ci-changes). A required check: if it fails, the jobs that need it are
  # skipped, and a skipped job counts as passed.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
      image: ${{ steps.changes.outputs.image }}
      k8s: ${{ steps.changes.outputs.k8s }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }} # '0' as a string: 0 is falsy in expressions
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-changes "$EVENT" "$BASE" "$HEAD"

  # Documentation-only pull requests still build and run the SonarQube Cloud analysis, because its check is required and
  # only an analysis posts it; tests, format and audit are skipped there. Not on the schedule.
  dotnet:
    name: dotnet
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # SonarQube Cloud needs the history for blame and new-code detection
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          # Release (tag) builds start without caches, so nothing restored from a cache reaches a release (zizmor cache-poisoning).
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: "**/packages.lock.json"
      # NuGetAudit runs during restore; its warnings are errors (TreatWarningsAsErrors).
      - run: dotnet restore
      - run: dotnet tool restore
      # SonarQube Cloud, CI-based analysis (D-20). Secrets are absent on fork PRs (and on
      # Dependabot PRs without the Dependabot secret), so the analysis is skipped there with a notice.
      # The quality gate is the required check "SonarCloud Code Analysis" posted by the SonarQube
      # Cloud app; this job does not wait for it.
      - name: SonarQube Cloud enabled
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SONAR_TOKEN is not available (fork PR or missing secret); SonarQube Cloud analysis skipped"
          fi
      - name: SonarQube Cloud begin
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet sonarscanner begin
          /k:aschamberger_microdcs /o:aschamberger
          /d:sonar.host.url=https://sonarcloud.io
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.projectBaseDir="$GITHUB_WORKSPACE"
          /d:sonar.cs.vscoveragexml.reportsPaths=TestResults/*.xml
          /d:sonar.cs.vstest.reportsPaths=TestResults/*.trx
          /d:sonar.exclusions="docs/**,spikes/**,**/*.g.cs"
          /d:sonar.coverage.exclusions="tests/**,bench/**,tools/**"
          /d:sonar.cpd.exclusions="tests/**,bench/**,tools/**,src/MicroDCS.JobControl/Conversions/JobControlConversions.cs"
          /d:sonar.cs.roslyn.ignoreIssues=true
      - run: dotnet build --no-restore --no-incremental -c Release
      # The integration tests run here against the compose.test.yaml services (D-15, revised in S22a), so their coverage
      # reaches SonarQube Cloud. `--fail-skips on` fails the run when a test skips because a service variable is missing;
      # the replica tests need the Docker socket and run in the "integration" job.
      - name: Start Valkey, Mosquitto and NATS
        if: env.CODE == 'true'
        run: docker compose -f compose.test.yaml up -d --wait valkey valkey-acl mosquitto nats
      - if: env.CODE == 'true'
        run: >-
          dotnet test --no-build -c Release --results-directory TestResults --report-xunit-trx
          --coverage --coverage-output-format xml
          --filter-not-trait Category=Image --fail-skips on
        env:
          MICRODCS_TEST_VALKEY: localhost:6380
          MICRODCS_TEST_MQTT: localhost:1884
          MICRODCS_TEST_NATS: localhost:4223
          MICRODCS_TEST_VALKEY_ACL: localhost:6381
      - name: SonarQube Cloud end
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      - if: env.CODE == 'true'
        run: dotnet format --verify-no-changes --no-restore
      - name: NuGet vulnerability audit (direct and transitive)
        if: env.CODE == 'true'
        run: |
          dotnet package list --vulnerable --include-transitive --format json > vulnerable.json
          if jq -e '[.projects[] | select(.frameworks)] | length > 0' vulnerable.json > /dev/null; then
            jq '[.projects[] | select(.frameworks)]' vulnerable.json
            echo "::error::vulnerable NuGet packages found"
            exit 1
          fi
      - if: failure() && env.CODE == 'true'
        name: Service logs
        run: |
          mkdir -p TestResults
          docker compose -f compose.test.yaml logs --no-color --timestamps > TestResults/services.log || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: TestResults/
          if-no-files-found: ignore

  # Builds the final image (scripts/aot-publish enforces the D-14 warning allowlist) and runs the
  # CloudEvents AOT smoke check in it: chiseled runtime-deps, non-root, no shell. One native runner
  # per platform (D-32): Native AOT links for the build machine's architecture, and emulation is slow. linux-arm64 runs on a
  # pull request only when the image inputs change (D-32 revised in S22a); otherwise its steps are skipped.
  container:
    name: container (${{ matrix.rid }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUN: ${{ needs.changes.outputs.code == 'true' && (matrix.rid == 'linux-x64' || needs.changes.outputs.image == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::not needed for this change (scripts/ci-changes)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.RUN == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: microdcs:ci
          load: true
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,scope=runtime-{0}', matrix.rid) || '' }}
          cache-to: type=gha,scope=runtime-${{ matrix.rid }},mode=max
      - name: AOT smoke check in the container
        if: env.RUN == 'true'
        run: docker run --rm microdcs:ci smoke
      - name: Binary matches the platform
        if: env.RUN == 'true'
        env:
          RID: ${{ matrix.rid }}
        run: |
          arch=$(docker image inspect microdcs:ci --format '{{.Architecture}}')
          case "$RID:$arch" in
            linux-x64:amd64|linux-arm64:arm64) echo "image architecture: $arch" ;;
            *) echo "::error::$RID built an $arch image"; exit 1 ;;
          esac
      - name: Image runs as non-root without a shell
        if: env.RUN == 'true'
        run: |
          test "$(docker image inspect microdcs:ci --format '{{.Config.User}}')" = "1654"
          if docker run --rm --entrypoint sh microdcs:ci -c true 2>/dev/null; then
            echo "::error::the runtime image contains a shell"
            exit 1
          fi

  # deploy/ in a kind cluster with the image built here (scripts/k8s-test): probes, Pod Security "restricted", NetworkPolicies
  # and the management token. kind and kubectl are pinned with checksums in the script.
  # On a pull request only when the manifest, the kind test or the image inputs change (D-56); always on main and daily.
  # Builds its own image in parallel to the container job (from that job's cache where it exists): taking the container
  # job's image would wait for both matrix legs, linux-arm64 included.
  kubernetes:
    name: kubernetes
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Reads the container job's cache; this job does not write one.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: microdcs:kind
          load: true
          cache-from: type=gha,scope=runtime-linux-x64
      - name: Install kind and kubectl
        run: |
          scripts/k8s-test install "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Kubernetes test in kind
        run: scripts/k8s-test
        env:
          IMAGE_BUILT: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes-results
          path: TestResults/k8s/
          if-no-files-found: ignore

  # The image tests (scripts/image-tests): two replicas of the application image killed from outside (S20, D-53) and the
  # acceptance tests that drive the image over MQTT (S23, Q-TEST-2), run by the `tests` image of the Dockerfile; this
  # is also the check that the compose test image builds. The rest of the integration suite runs in the dotnet job (D-15,
  # revised in S22a). Builds its own runtime image in parallel to the container job: waiting for that job's image would put
  # both builds on the critical path.
  integration:
    name: integration
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image tests (SFC replicas, acceptance)
        run: scripts/image-tests
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-results
          path: TestResults/image/
          if-no-files-found: ignore

  # Benchmark baseline (R-18, D-58): allocated bytes per operation of the envelope codec and the pipeline against
  # bench/baseline.json (scripts/bench); mean times go to the job summary only. Not a required check; runs beside the others.
  bench:
    name: bench
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: "**/packages.lock.json"
      - name: Benchmarks against the baseline
        run: scripts/bench
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: TestResults/bench/
          if-no-files-found: ignore

  # Publishes the image of each platform by digest after every check passed (D-32, D-55): build (from the container job's cache on
  # main, from scratch for a release tag),
  # SBOMs of the app's NuGet closure and of the OS packages (scripts/scan sbom, with the Trivy gate), push, cosign keyless signature
  # and one CycloneDX attestation per SBOM on the platform digest.
  publish:
    name: publish (${{ matrix.rid }})
    if: github.event_name == 'push'
    needs: [dotnet, container, integration, kubernetes]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing (Fulcio certificate from the workflow's OIDC token)
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - run: mkdir -p scan-results
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: microdcs:publish
          outputs: type=docker,dest=scan-results/image.tar
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,scope=runtime-{0}', matrix.rid) || '' }}
      - name: SBOMs and vulnerability gate
        run: scripts/scan sbom scan-results/image.tar
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same build again, now pushed by digest without a tag; every layer comes from the builder's cache of the step above.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,scope=runtime-{0}', matrix.rid) || '' }}
      - name: Sign and attest the SBOMs
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          RID: ${{ matrix.rid }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate scan-results/sbom-trivy-app.cdx.json "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate scan-results/sbom-trivy-image.cdx.json "$IMAGE@$DIGEST"
          mkdir -p digests
          echo "$DIGEST" > "digests/$RID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.rid }}
          path: digests/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.rid }}
          path: scan-results/sbom-*.cdx.json

  # One multi-arch index over the two platform digests, tagged, signed and verified. Tags: `main` and `sha-<short>` on main;
  # `<version>` on a v<version> tag, plus `<major>.<minor>` and `latest` when it is a final release (no pre-release suffix).
  publish-manifest:
    name: publish-manifest
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the index and its tags
      id-token: write # cosign keyless signing of the index
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create, sign and verify the index
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tags=()
          case "$REF" in
            refs/heads/main) tags=(main "sha-${SHA::12}") ;;
            refs/tags/v*)
              version=${REF#refs/tags/v}
              tags=("$version")
              # Only a final release moves `<major>.<minor>` and `latest`; a pre-release (v1.0.0-rc.1) gets its own tag only.
              if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                tags+=("$(cut -d. -f1-2 <<<"$version")" latest)
              fi
              ;;
            *) echo "::error::unexpected ref $REF"; exit 1 ;;
          esac
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$IMAGE:$tag"); done
          sources=()
          for rid in linux-x64 linux-arm64; do sources+=("$IMAGE@$(cat "digests/$rid")"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$digest"

          # What a cluster admission policy or an operator checks (docs/security.md#verifying-the-image).
          identity="^https://github.com/$REPOSITORY/.github/workflows/ci.yml@refs/(heads/main|tags/v.+)$"
          issuer=https://token.actions.githubusercontent.com
          for ref in "$IMAGE@$digest" "${sources[@]}"; do
            cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$ref" > /dev/null
          done
          for ref in "${sources[@]}"; do
            cosign verify-attestation --type cyclonedx --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$ref" > /dev/null
          done
          {
            echo "### Published image"
            echo
            echo "\`$IMAGE@$digest\`"
            echo
            echo "Tags: ${tags[*]}. Signature and SBOM attestations verified."
          } >> "$GITHUB_STEP_SUMMARY"
