# .NET CI: build, tests with coverage, SonarQube Cloud analysis (D-20), format, NuGet audit,
# Native AOT container image with the CloudEvents smoke check (D-14), and the compose integration
# harness (D-15). Gitleaks and Trivy run in security.yml.
# Job names are required checks on `main` (dotnet, container (linux-x64), container (linux-arm64),
# integration); renaming a job or a matrix entry means updating the branch protection.
# Actions are pinned by full commit SHA with the release in a comment (D-20); Dependabot bumps both.
name: ci
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CI: "true" # locked-mode restore (Directory.Build.props)
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # SonarQube Cloud needs the history for blame and new-code detection
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # NuGetAudit runs during restore; its warnings are errors (TreatWarningsAsErrors).
      - run: dotnet restore
      - run: dotnet tool restore
      # SonarQube Cloud, CI-based analysis (D-20). Secrets are absent on fork PRs (and on
      # Dependabot PRs without the Dependabot secret), so the analysis is skipped there with a notice.
      # The quality gate is the required check "SonarCloud Code Analysis" posted by the SonarQube
      # Cloud app; this job does not wait for it.
      - name: SonarQube Cloud enabled
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SONAR_TOKEN is not available (fork PR or missing secret); SonarQube Cloud analysis skipped"
          fi
      - name: SonarQube Cloud begin
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet sonarscanner begin
          /k:aschamberger_microdcs /o:aschamberger
          /d:sonar.host.url=https://sonarcloud.io
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.projectBaseDir="$GITHUB_WORKSPACE"
          /d:sonar.cs.vscoveragexml.reportsPaths=TestResults/*.xml
          /d:sonar.cs.vstest.reportsPaths=TestResults/*.trx
          /d:sonar.exclusions="docs/**,spikes/**,**/*.g.cs"
          /d:sonar.coverage.exclusions="tests/**"
          /d:sonar.cpd.exclusions="tests/**"
          /d:sonar.cs.roslyn.ignoreIssues=true
      - run: dotnet build --no-restore --no-incremental -c Release
      - run: >-
          dotnet test --no-build -c Release --results-directory TestResults --report-xunit-trx
          --coverage --coverage-output-format xml
      - name: SonarQube Cloud end
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      - run: dotnet format --verify-no-changes --no-restore
      - name: NuGet vulnerability audit (direct and transitive)
        run: |
          dotnet package list --vulnerable --include-transitive --format json > vulnerable.json
          if jq -e '[.projects[] | select(.frameworks)] | length > 0' vulnerable.json > /dev/null; then
            jq '[.projects[] | select(.frameworks)]' vulnerable.json
            echo "::error::vulnerable NuGet packages found"
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: TestResults/
          if-no-files-found: ignore

  # Builds the final image (scripts/aot-publish enforces the D-14 warning allowlist) and runs the
  # CloudEvents AOT smoke check in it: chiseled runtime-deps, non-root, no shell. One native runner
  # per platform (D-32): Native AOT links for the build machine's architecture, and emulation is slow.
  container:
    name: container (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: microdcs:ci
          load: true
          cache-from: type=gha,scope=runtime-${{ matrix.rid }}
          cache-to: type=gha,scope=runtime-${{ matrix.rid }},mode=max
      - name: AOT smoke check in the container
        run: docker run --rm microdcs:ci smoke
      - name: Binary matches the platform
        env:
          RID: ${{ matrix.rid }}
        run: |
          arch=$(docker image inspect microdcs:ci --format '{{.Architecture}}')
          case "$RID:$arch" in
            linux-x64:amd64|linux-arm64:arm64) echo "image architecture: $arch" ;;
            *) echo "::error::$RID built an $arch image"; exit 1 ;;
          esac
      - name: Image runs as non-root without a shell
        run: |
          test "$(docker image inspect microdcs:ci --format '{{.Config.User}}')" = "1654"
          if docker run --rm --entrypoint sh microdcs:ci -c true 2>/dev/null; then
            echo "::error::the runtime image contains a shell"
            exit 1
          fi

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose harness (D-15)
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      # compose exits 0 when the tests container never ran (for example a dependency failed to
      # start), so check the container's own exit code as well.
      - name: Tests container exited with 0
        run: test "$(docker compose -f compose.test.yaml ps -a tests --format '{{.State}} {{.ExitCode}}')" = "exited 0"
      - if: always()
        name: Collect results and service logs
        run: |
          mkdir -p compose-results
          docker compose -f compose.test.yaml cp tests:/results compose-results/ || true
          docker compose -f compose.test.yaml logs --no-color --timestamps > compose-results/services.log || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-results
          path: compose-results/
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f compose.test.yaml down -v
