name: tests
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src app tests
          uv run ruff format --check src app tests
      - name: Type check
        run: uv run pyright src app tests
      - name: Unit tests
        run: uv run pytest tests/unit --cov=microdcs --cov-report=term-missing
  test-next-python:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.15
      # datamodel-code-generator (dev-only) does not know 3.15 yet
      - run: uv run --python 3.15 pytest tests/unit --ignore=tests/unit/test_dataclassgen.py
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Audit locked dependencies
        run: |
          uv export --locked --no-hashes --no-emit-project -o requirements.audit.txt
          uvx pip-audit -r requirements.audit.txt --no-deps --disable-pip
