# Security scans (D-20): Gitleaks (secrets, git history), actionlint and zizmor (workflows) and Trivy (vulnerabilities in the lock
# files, misconfiguration, image OS packages, SBOM). All scanners run through scripts/scan and the
# digest-pinned containers in compose.scan.yaml, exactly as locally. No marketplace scanner actions.
# Job names are required checks on `main` (gitleaks, workflows, trivy-fs, trivy-image); renaming a job means
# updating the branch protection.
# Actions are pinned by full commit SHA with the release in a comment (D-20); Dependabot bumps both.
name: security
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 4 * * *" # daily: new CVEs appear without a code change
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Pull requests: the commits of the PR. Push to main, daily, manual: the full history of all
      # refs (includes the Python history shared with python-archive).
      - name: Gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/scan range "$BASE..$HEAD"
          else
            git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
            scripts/scan history
          fi
      # Findings are redacted; the SARIF stays an artifact (not code scanning) on purpose.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: scan-results/gitleaks.sarif
          if-no-files-found: ignore

  # actionlint (correctness, shellcheck) and zizmor (workflow security). zizmor runs online with the
  # job's read-only token: impostor commits behind pinned SHAs, known-vulnerable actions.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scan-results
          scripts/scan workflows
      - if: always() && hashFiles('scan-results/zizmor.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scan-results/zizmor.sarif
          category: zizmor

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy DB cache key
        id: trivy-db
        run: echo "key=trivy-db-$(date --utc +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: ${{ steps.trivy-db.outputs.key }}
          restore-keys: trivy-db-
      - name: Trivy fs
        run: scripts/scan fs
      # Fork PRs get a read-only token; their results stay in the job log.
      - if: always() && hashFiles('scan-results/trivy-fs.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scan-results/trivy-fs.sarif
          category: trivy-fs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-source
          path: scan-results/sbom-trivy-fs.cdx.json
          if-no-files-found: ignore

  # The AOT binary carries no .deps.json, so the image scan sees OS packages only; the NuGet
  # packages inside the binary are covered by trivy-fs (lock files). One platform is enough: both
  # images come from the same digest-pinned base (linux-x64 and linux-arm64, D-32).
  trivy-image:
    name: trivy-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy DB cache key
        id: trivy-db
        run: |
          echo "key=trivy-db-$(date --utc +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          mkdir -p scan-results
      # Restore only: trivy-fs saves the same daily key. This job builds an image, so it must not
      # write caches (zizmor cache-poisoning).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: ${{ steps.trivy-db.outputs.key }}
          restore-keys: trivy-db-
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Image as a tarball, no registry push; shares the build cache with ci.yml.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: microdcs:scan
          outputs: type=docker,dest=scan-results/image.tar
          cache-from: type=gha,scope=runtime-linux-x64
      - name: Trivy image
        run: scripts/scan image scan-results/image.tar
      - if: always() && hashFiles('scan-results/trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scan-results/trivy-image.sarif
          category: trivy-image
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image
          path: scan-results/sbom-trivy-image.cdx.json
          if-no-files-found: ignore
