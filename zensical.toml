[project]
site_name = "MicroDCS"
site_url = "https://aschamberger.github.io/microdcs/"
site_description = "An Open-Standards-Based Framework for Distributed Sequence Control Applications"
repo_url = "https://github.com/aschamberger/microdcs"
repo_name = "aschamberger/microdcs"
copyright = "Copyright &copy; 2026 Andreas Schamberger"
nav = [
  {"Home" = "index.md"},
  {"Concepts at a Glance" = "concepts.md"},
  {"Your First Processor" = "your-first-processor.md"},
  {"Overall Design" = [
    {"Overview" = "overall-design.md"},
    {"Technical Standards" = "technical-standards.md"},
    {"Information Model Standards" = "information-model-standards.md"},
    {"SFC Engine" = "sfc-engine.md"},
    {"Machinery Jobs \u2013 MES Publishing" = "machinery-jobs-mes-publishing.md"}
  ]},
  {"Development" = [
    {"Overview" = "development.md"},
    {"Processors" = "processors-dotnet.md"},
    {"MQTT transport" = "mqtt-transport.md"},
    {"NATS transport" = "nats-transport.md"},
    {"Valkey layer" = "valkey-layer.md"},
    {"Persistence" = "persistence.md"},
    {"SFC core" = "sfc-core.md"},
    {"Job models and state machine" = "job-control.md"},
    {"Inspection and MCP" = "inspection.md"},
    {"HTTP surface and observability" = "observability.md"}
  ]},
  {"Operations" = [
    {"Overview" = "operations.md"},
    {"Deployment" = "deployment.md"},
    {"Security and Authorization" = "security.md"}
  ]},
  {"Design Record" = [
    {"Decisions" = "porting/decisions.md"},
    {"Research" = [
      {"Porting approach (branching)" = "porting/research/branching.md"},
      {"Abstraction mapping" = "porting/research/abstraction.md"},
      {"CloudEvents" = "porting/research/cloudevents.md"},
      {"Test setup" = "porting/research/test-setup.md"},
      {"CI scanning" = "porting/research/ci-scanning.md"},
      {"Inspection and MCP" = "porting/research/inspection-mcp.md"},
      {"SFC core" = "porting/research/sfc-core.md"},
      {"Job models" = "porting/research/job-models.md"},
      {"Machinery Jobs" = "porting/research/machinery-jobs.md"},
      {"Job order publisher" = "porting/research/job-publisher.md"},
      {"Data layer" = "porting/research/data-layer.md"},
      {"SFC rules" = "porting/research/sfc-rules.md"},
      {"SFC host" = "porting/research/sfc-host.md"},
      {"Valkey findings" = "porting/research/valkey-findings.md"},
      {"MQTT transport" = "porting/research/mqtt-transport.md"},
      {"NATS transport" = "porting/research/nats-transport.md"},
      {"HTTP surface and observability" = "porting/research/http-observability.md"},
      {"Deployment and security review" = "porting/research/deployment-security.md"},
      {"CI runtime review" = "porting/research/ci-runtime.md"},
      {"Library spike" = "porting/research/library-spike.md"},
      {"OPC UA spike" = "porting/research/opcua-spike.md"},
      {"Core contracts" = "porting/research/core-contracts.md"},
      {"Review triage" = "porting/research/review-triage.md"},
      {"M1 review" = "porting/research/m1-review.md"},
      {"Parity acceptance" = "porting/research/parity-acceptance.md"},
      {"Docs port" = "porting/research/docs-port.md"},
      {"Python design decisions, sorted" = "porting/research/python-design-decisions.md"}
    ]},
    {"Port to .NET (archived)" = [
      {"Plan" = "porting/index.md"},
      {"Sessions" = "porting/sessions.md"},
      {"Log" = "porting/log.md"}
    ]}
  ]}
]

[project.theme]
custom_dir = "overrides"
features = [
    "navigation.tabs",
    "navigation.footer"
]

[project.theme.icon]
logo = "simple/microstation"
repo = "simple/github"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "deep purple"
toggle.icon = "material/weather-sunny"
toggle.name = "Dark mode"

[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "deep orange"
toggle.icon = "material/weather-night"
toggle.name = "Light mode"

[[project.extra.social]]
icon = "simple/github"
link = "https://github.com/aschamberger"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.magiclink]

[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.details]
