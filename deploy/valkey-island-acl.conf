# Valkey ACL user of one MicroDCS island (docs/deployment.md#tenancy), as a valkey.conf directive. Replace `site1` with the island's
# MicroDcs:Valkey:KeyPrefix and PASSWORD with its password (or use ACL SETUSER with the same rules). The Valkey integration tests run
# the production code as this user, and scripts/k8s-test checks that tests/k8s uses the same line.
#
# Granted: the island's keys and channels, the data, stream, scripting and pub/sub commands, TIME (server clock of the SFC host).
# Taken away again: everything server-wide that would let one island harm or watch another on a shared Valkey: @dangerous
# (FLUSHALL, SWAPDB, KEYS, CLIENT KILL/LIST/PAUSE, CONFIG, INFO, ...), FLUSHDB, SELECT, MOVE, COPY, RANDOMKEY, DBSIZE, functions,
# SCRIPT FLUSH/KILL, PUBSUB introspection, client tracking. SCAN stays for the index and maintenance tools; it lists key names of
# every island, which is one reason to give each island its own Valkey.
user microdcs on >PASSWORD resetkeys ~site1:* resetchannels &site1:* -@all +@read +@write +@keyspace +@stream +@hash +@sortedset +@set +@string +@list +@scripting +@pubsub +@connection +@transaction +time -@dangerous -flushdb -select -move -copy -randomkey -dbsize -function -fcall -fcall_ro -script|flush -script|kill -pubsub -client|tracking
