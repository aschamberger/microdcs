# Integration test harness (D-15). Locally, everything in containers:
#
#   docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
#   docker compose -f compose.test.yaml down -v
#
# CI starts valkey, valkey-acl, mosquitto and nats from this file and runs the suite on the host (D-15 revised in S22a).
#
# Host mode for fast iteration: `docker compose -f compose.test.yaml up -d valkey mosquitto`, then
# `dotnet test` with MICRODCS_TEST_VALKEY=localhost:6380 and MICRODCS_TEST_MQTT=localhost:1884
# (add `nats` and MICRODCS_TEST_NATS=localhost:4223 for the NATS tests, `valkey-acl` and
# MICRODCS_TEST_VALKEY_ACL=localhost:6381 for the Valkey credential test)
# (ports offset from the dev stack in compose.yaml so both can run at once).
#
# No named volumes: every run starts empty. Images are pinned by digest (Dependabot docker-compose).

name: microdcs-test

services:
  valkey:
    # valkey-bundle (D-26), same image as the dev stack; no persistence in tests.
    image: valkey/valkey-bundle:9@sha256:c64007296a2a38398d4be63847e1c9890954e45574c16cbe607883ba71c6b985
    command: valkey-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Valkey that requires authentication: the default user has a password, so a rejected AUTH leaves the connection unusable as
  # it would be in production (credential rotation test, D-49). The password is a test fixture.
  valkey-acl:
    image: valkey/valkey-bundle:9@sha256:c64007296a2a38398d4be63847e1c9890954e45574c16cbe607883ba71c6b985
    command: valkey-server --save "" --appendonly no --requirepass harness-admin
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "harness-admin", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  mosquitto:
    image: eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    # Anonymous clients are accepted; a client that names a user must know its password (secret rotation test, D-49).
    command: mosquitto -c /etc/mosquitto/mosquitto-test.conf
    volumes:
      - ./tests/MicroDCS.IntegrationTests/Mqtt/mosquitto-test.conf:/etc/mosquitto/mosquitto-test.conf:ro
      - ./tests/MicroDCS.IntegrationTests/Mqtt/mosquitto-test.passwd:/etc/mosquitto/mosquitto-test.passwd:ro
    ports:
      - "127.0.0.1:1884:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 2s
      timeout: 5s
      retries: 15

  nats:
    # JetStream with per-message TTL needs 2.11 or later (D-47). Two accounts (tenant-a, tenant-b) test tenancy (R-20).
    image: nats:2.15-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    command: ["-c", "/etc/nats/nats-test.conf"]
    volumes:
      - ./tests/MicroDCS.IntegrationTests/Nats/nats-test.conf:/etc/nats/nats-test.conf:ro
    ports:
      - "127.0.0.1:4223:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The application image joins as the system under test once it has a long-running host (S08,
  # S13). A one-shot service cannot be part of this file: any container exit triggers
  # --abort-on-container-exit before the tests run, and compose then still exits 0. The AOT smoke
  # check (D-14) runs as `docker run` of the runtime image in CI instead.

  # Image tests (scripts/image-tests): the SFC replica tests (S20, D-53) and the acceptance tests (S23, Q-TEST-2) run
  # against the application image in the `image` profile. Separate from `tests`, because a replica that gets killed
  # would end --abort-on-container-exit. Only this profile mounts the Docker socket.
  sfc-a: &replica
    profiles: [image]
    build:
      context: .
      target: runtime
    image: microdcs:image-test
    container_name: microdcs-test-sfc-a
    command: ["serve"]
    environment: &replica-environment
      DOTNET_ENVIRONMENT: Test
      APP_MicroDcs__InstanceId: sfc-a
      APP_MicroDcs__Roles: Processor
      APP_MicroDcs__CloudEventSource: urn:it:replicas
      APP_MicroDcs__Bindings__machinery_jobs__Transport: mqtt
      APP_MicroDcs__Bindings__machinery_jobs__Prefix: sfcr-mes
      APP_MicroDcs__Bindings__machinery_jobs__ScopeLevels: "2"
      APP_MicroDcs__Bindings__machinery_jobs__ReplyBase: sfcr-mes-reply
      APP_MicroDcs__Bindings__greetings__Transport: mqtt
      APP_MicroDcs__Bindings__greetings__Prefix: sfcr
      APP_MicroDcs__Bindings__greetings__ScopeLevels: "2"
      APP_MicroDcs__Bindings__greetings__ReplyBase: sfcr-reply
      APP_MicroDcs__Mqtt__Hostname: mosquitto
      APP_MicroDcs__Mqtt__Port: "1883"
      APP_MicroDcs__Mqtt__TlsCaFile: /nonexistent/ca.crt
      APP_MicroDcs__Mqtt__SatTokenFile: /nonexistent/sat
      APP_MicroDcs__Valkey__ConnectionString: valkey:6379
      APP_MicroDcs__Valkey__KeyPrefix: sfcr
      APP_MicroDcs__Valkey__ScopeRefreshInterval: "00:00:00.500"
      APP_MicroDcs__Valkey__PollInterval: "00:00:00.200"
      APP_MicroDcs__Sfc__OutageThreshold: "00:00:04"
      APP_MicroDcs__Sfc__AutoclaimIdle: "00:00:03"
      APP_MicroDcs__Sfc__ExpiryGrace: "00:00:00"
    depends_on:
      valkey:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  sfc-b:
    <<: *replica
    container_name: microdcs-test-sfc-b
    environment:
      <<: *replica-environment
      APP_MicroDcs__InstanceId: sfc-b

  # Acceptance (S23, Q-TEST-2): the image with every role and the demo bindings, driven only over MQTT as an MES and
  # the equipment would. The Python app tests ran against the application the same way.
  app:
    profiles: [image]
    image: microdcs:image-test
    container_name: microdcs-test-app
    command: ["serve"]
    environment:
      DOTNET_ENVIRONMENT: Test
      APP_MicroDcs__InstanceId: app
      APP_MicroDcs__CloudEventSource: urn:it:acceptance
      APP_MicroDcs__Bindings__machinery_jobs__Transport: mqtt
      APP_MicroDcs__Bindings__machinery_jobs__Prefix: acc-mes
      APP_MicroDcs__Bindings__machinery_jobs__ScopeLevels: "2"
      APP_MicroDcs__Bindings__machinery_jobs__ReplyBase: acc-mes-reply
      APP_MicroDcs__Bindings__greetings__Transport: mqtt
      APP_MicroDcs__Bindings__greetings__Prefix: acc
      APP_MicroDcs__Bindings__greetings__ScopeLevels: "2"
      APP_MicroDcs__Bindings__greetings__ReplyBase: acc-reply
      APP_MicroDcs__Mqtt__Hostname: mosquitto
      APP_MicroDcs__Mqtt__Port: "1883"
      APP_MicroDcs__Mqtt__TlsCaFile: /nonexistent/ca.crt
      APP_MicroDcs__Mqtt__SatTokenFile: /nonexistent/sat
      APP_MicroDcs__Valkey__ConnectionString: valkey:6379
      APP_MicroDcs__Valkey__KeyPrefix: acc
      APP_MicroDcs__Valkey__ScopeRefreshInterval: "00:00:00.500"
      APP_MicroDcs__Valkey__PollInterval: "00:00:00.200"
      APP_MicroDcs__Sfc__ExpiryGrace: "00:00:00"
    depends_on:
      valkey:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  image-tests:
    profiles: [image]
    build:
      context: .
      target: tests
    image: microdcs-tests:test
    entrypoint: ["dotnet", "test", "--project", "tests/MicroDCS.IntegrationTests", "-c", "Release", "--no-build",
                 "--fail-skips", "on", "--results-directory", "/results", "--report-xunit-trx",
                 "--filter-trait", "Category=Image"]
    environment:
      MICRODCS_TEST_VALKEY: valkey:6379
      MICRODCS_TEST_MQTT: mosquitto:1883
      MICRODCS_TEST_DOCKER: /var/run/docker.sock
      MICRODCS_TEST_APP: acc
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./TestResults/image:/results
    depends_on:
      valkey:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  tests:
    build:
      context: .
      target: tests
    image: microdcs-tests:test
    environment:
      MICRODCS_TEST_VALKEY: valkey:6379
      MICRODCS_TEST_MQTT: mosquitto:1883
      MICRODCS_TEST_NATS: nats:4222
      MICRODCS_TEST_VALKEY_ACL: valkey-acl:6379
    depends_on:
      valkey:
        condition: service_healthy
      valkey-acl:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      nats:
        condition: service_healthy
