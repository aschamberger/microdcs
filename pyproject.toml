[project]
name = "microdcs"
version = "0.1.0"
description = "An Open-Standards-Based Framework for Distributed Sequence Control Applications"
readme = "README.md"
authors = [
    { name = "Andreas Schamberger", email = "mail@andreass.net" }
]
requires-python = ">=3.14"
dependencies = [
    "aiomqtt @ git+https://github.com/empicano/aiomqtt.git@4c362b39a54a64e9a39720d29190cd56f98cb0ca",
    "mashumaro[orjson]>=3.21",
    "msgpack>=1.1.2",
    "opentelemetry-distro>=0.60b1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
    "opentelemetry-instrumentation-aiomqtt",
    "opentelemetry-instrumentation-redis>=0.62b0",
    "redis[hiredis]>=7.4.0",
    "transitions>=0.9.3",
    "typer>=0.24.0",
]

[project.urls]
Homepage = "https://microdcs.io"
Documentation = "https://aschamberger.github.io/microdcs/"
Repository = "https://github.com/aschamberger/microdcs"
Issues = "https://github.com/aschamberger/microdcs/issues"

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]>=0.57.0",
    "zensical",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-benchmark>=5.2.3",
    "pyright>=1.1.414",
]

[project.scripts]
microdcs = "microdcs.scripts.microdcs:app"

[build-system]
requires = ["uv_build>=0.11.11,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring external services (MQTT, Redis)",
]

[tool.uv]
override-dependencies = [
    "opentelemetry-api==1.45.0",
    "opentelemetry-instrumentation==0.66b0",
    "opentelemetry-semantic-conventions==0.66b0",
]

[tool.uv.sources]
opentelemetry-instrumentation-aiomqtt = { git = "https://github.com/aschamberger/opentelemetry-python-contrib", subdirectory = "instrumentation/opentelemetry-instrumentation-aiomqtt", rev = "c4f91c7ebea288253bc0fba3ec9f94b0bd50c0ca" }

[tool.ruff]
format.preview = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/microdcs/models/__init__.py" = ["F403"]
