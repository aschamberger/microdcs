# Local development stack. Unauthenticated and plaintext - not for production.
#
#   docker compose up -d         # MQTT broker, NATS, Valkey, Aspire dashboard
#   docker compose down -v       # stop and wipe the valkey-data volume
#
# The .NET app runs on the host (`dotnet run`) against these ports. The integration
# test harness is a separate file (compose.test.yaml, S02).
#
# Profile `app` also runs the application image (`microdcs serve`: greetings demo on the in-memory
# transport, Valkey, and the management listener with MCP and the write tools, S11):
#
#   export MICRODCS_MCP_TOKEN=$(openssl rand -hex 16)
#   docker compose --profile app up -d --build --wait
#
# The management port is published on 127.0.0.1 only and needs the bearer token (D-19, R-8).
# Dev and test only: never enable the write tools or the MCP server in production.
# Images are pinned by digest; the tag in front of the digest is informational only.
# Dependabot (docker ecosystem) proposes digest updates.

services:
  mosquitto:
    image: eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NATS with JetStream for the NATS transport (D-47). Set APP_MicroDcs__Bindings__greetings__Transport=nats and
  # APP_MicroDcs__Nats__Url=nats://localhost:4222 to run the greetings demo on it.
  nats:
    image: nats:2.15-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # valkey-bundle includes valkey-json, valkey-search and valkey-bloom (D-26).
  # The image entrypoint loads the modules for any valkey-server command line.
  valkey:
    image: valkey/valkey-bundle:9@sha256:c64007296a2a38398d4be63847e1c9890954e45574c16cbe607883ba71c6b985
    command: valkey-server --appendonly yes --appendfsync everysec
    volumes:
      - valkey-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    profiles: ["app"]
    build: .
    command: ["serve"]
    environment:
      APP_MicroDcs__CloudEventSource: urn:microdcs:dev
      APP_MicroDcs__Bindings__greetings__Transport: mqtt
      APP_MicroDcs__Bindings__greetings__Prefix: dev
      APP_MicroDcs__Bindings__greetings__ScopeLevels: "2"
      APP_MicroDcs__Bindings__greetings__ReplyBase: dev-reply
      APP_MicroDcs__Mqtt__Hostname: mosquitto
      APP_MicroDcs__Valkey__ConnectionString: valkey:6379
      APP_MicroDcs__Valkey__KeyPrefix: microdcs
      APP_MicroDcs__Management__Enabled: "true"
      APP_MicroDcs__Management__McpEnabled: "true"
      APP_MicroDcs__Management__WriteEnabled: "true"
      APP_MicroDcs__Management__Url: http://0.0.0.0:8081
      APP_MicroDcs__Management__BearerTokenFile: /run/secrets/mcp_token
      # Maintenance tools (D-45): Development only, second guard through the marker key written by `valkey-marker`.
      DOTNET_ENVIRONMENT: Development
      APP_MicroDcs__Maintenance__Enabled: "true"
      APP_MicroDcs__Maintenance__RequireEnvironmentMarker: "true"
      APP_MicroDcs__Maintenance__SnapshotDirectory: /tmp/microdcs-snapshots
    ports:
      - "127.0.0.1:8081:8081"
    secrets:
      - mcp_token
    depends_on:
      valkey:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      valkey-marker:
        condition: service_completed_successfully

  # Marks this Valkey as a dev instance for the maintenance guard (D-45): `{prefix}:env` holds the environment name.
  valkey-marker:
    profiles: ["app"]
    image: valkey/valkey-bundle:9@sha256:c64007296a2a38398d4be63847e1c9890954e45574c16cbe607883ba71c6b985
    entrypoint: ["valkey-cli", "-h", "valkey", "SET", "microdcs:env", "Development"]
    restart: "no"
    depends_on:
      valkey:
        condition: service_healthy

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest@sha256:55a5a9fb88ddcff91997d6889912a19a1627e3584bd41fa5141c9db5f8376754
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888" # dashboard UI
      - "4317:18889" # OTLP/gRPC
      - "4318:18890" # OTLP/HTTP

secrets:
  mcp_token:
    environment: MICRODCS_MCP_TOKEN

volumes:
  valkey-data:
