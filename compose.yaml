# Local development stack. Unauthenticated and plaintext - not for production.
#
#   docker compose up -d         # MQTT broker, Valkey, Aspire dashboard
#   docker compose down -v       # stop and wipe the valkey-data volume
#
# The .NET app runs on the host (`dotnet run`) against these ports. The integration
# test harness is a separate file (compose.test.yaml, S02).
# Images are pinned by digest; the tag in front of the digest is informational only.
# Dependabot (docker ecosystem) proposes digest updates.

services:
  mosquitto:
    image: eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 5

  # valkey-bundle includes valkey-json, valkey-search and valkey-bloom (D-26).
  # The image entrypoint loads the modules for any valkey-server command line.
  valkey:
    image: valkey/valkey-bundle:9@sha256:c64007296a2a38398d4be63847e1c9890954e45574c16cbe607883ba71c6b985
    command: valkey-server --appendonly yes --appendfsync everysec
    volumes:
      - valkey-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest@sha256:55a5a9fb88ddcff91997d6889912a19a1627e3584bd41fa5141c9db5f8376754
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888" # dashboard UI
      - "4317:18889" # OTLP/gRPC
      - "4318:18890" # OTLP/HTTP

volumes:
  valkey-data:
